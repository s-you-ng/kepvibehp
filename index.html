<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 업무 도구 모음</title>

<!-- 글꼴: Noto Sans KR (다른 도구와 같은 글꼴, 라이브러리가 아닌 글꼴 파일만 불러옴) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5/900.css">

<style>
  /* =========================================================
     기본 색상과 공통 값 (흰 배경 + 남색 포인트)
     ========================================================= */
  :root {
    --bg: #ffffff;            /* 전체 배경 */
    --card: #ffffff;          /* 카드 배경 */
    --soft: #f4f7fc;          /* 아주 옅은 배경 */
    --accent: #1f3a6d;        /* 포인트 색: 남색 */
    --accent-dark: #162b52;   /* 마우스를 올렸을 때 진한 남색 */
    --accent-soft: #e8eef8;   /* 연한 남색 배경 */
    --ink: #1c2433;           /* 기본 글자색 */
    --muted: #6b7486;         /* 보조 글자색 */
    --line: #e3e8f1;          /* 테두리 */
    --shadow: 0 6px 22px rgba(31, 58, 109, 0.08);
    --shadow-hover: 0 16px 34px rgba(31, 58, 109, 0.16);
    --radius: 20px;
    --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  /* ---------- 위쪽: 제목, 부제, 검색창 ---------- */
  header {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 44px 16px 8px;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-size: clamp(28px, 5.5vw, 42px);
    font-weight: 900;
    letter-spacing: -1px;
  }
  header h1 .hl { color: var(--accent); }
  header .subtitle {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 16px;
  }

  /* 검색창 */
  .search-wrap {
    position: relative;
    max-width: 520px;
    margin: 26px auto 0;
  }
  .search-wrap .icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: var(--muted);
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    padding: 14px 16px 14px 46px;
    color: var(--ink);
    background: var(--soft);
    border: 1.5px solid var(--line);
    border-radius: 999px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .search-wrap input:focus {
    background: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(31, 58, 109, .12);
  }
  .result-count {
    margin: 12px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .result-count b { color: var(--accent); }

  /* ---------- 가운데: 도구 카드 격자 ---------- */
  main {
    flex: 1;
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  .tool-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
  }

  .tool-card {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 24px 22px 22px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  /* 마우스를 올리면 살짝 떠오름 */
  .tool-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-hover);
    border-color: #c9d6ec;
  }

  .tool-card .emoji {
    width: 68px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    line-height: 1;
    background: var(--accent-soft);
    border-radius: 18px;
    margin-bottom: 16px;
  }
  .tool-card h2 {
    margin: 0 0 6px;
    font-size: 19px;
    font-weight: 700;
    color: var(--accent);
    word-break: keep-all;
  }
  .tool-card .desc {
    flex: 1;
    margin: 0 0 20px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--muted);
    word-break: keep-all;
  }

  /* "준비 중" 배지 (오른쪽 위) */
  .badge {
    position: absolute;
    top: 18px;
    right: 18px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--soft);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }
  /* 준비 중인 카드는 그림을 조금 흐리게 */
  .tool-card.not-ready .emoji { filter: grayscale(.6); opacity: .7; }

  /* [열기] 버튼 */
  .btn-open {
    display: block;
    text-align: center;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border-radius: 999px;
    text-decoration: none;
    transition: background .15s, transform .12s;
  }
  .btn-open:hover { background: var(--accent-dark); }
  .btn-open:active { transform: translateY(1px); }
  .btn-open:focus-visible { outline: 3px solid #9fb3d8; outline-offset: 2px; }
  /* 준비 중인 도구의 버튼: 누를 수 없게 흐리게 */
  .btn-open.disabled {
    color: var(--muted);
    background: var(--soft);
    border: 1px solid var(--line);
    cursor: not-allowed;
  }

  /* 검색 결과가 없을 때 */
  .no-result {
    padding: 48px 16px;
    text-align: center;
    color: var(--muted);
    background: var(--soft);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }

  /* ---------- 맨 아래 ---------- */
  footer {
    padding: 22px 16px 30px;
    text-align: center;
    border-top: 1px solid var(--line);
  }
  footer .maker {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
  }
  footer .notice {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--muted);
    word-break: keep-all;
  }

  /* =========================================================
     휴대폰 화면: 카드를 한 줄에 하나씩
     ========================================================= */
  @media (max-width: 820px) {
    header { padding-top: 32px; }
    .tool-grid { grid-template-columns: 1fr; gap: 14px; }
    .tool-card { padding: 20px 18px 18px; }
    /* 휴대폰에서는 그림과 글을 가로로 배치해 카드를 납작하게 */
    .tool-card .emoji { width: 56px; height: 56px; font-size: 32px; margin-bottom: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>나의 <span class="hl">업무 도구</span> 모음</h1>
  <p class="subtitle">바이브 코딩으로 직접 만든 업무 도우미</p>

  <!-- 도구 검색창 -->
  <div class="search-wrap">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <circle cx="11" cy="11" r="7" stroke-width="2"></circle>
      <path d="M20 20l-3.5-3.5" stroke-width="2" stroke-linecap="round"></path>
    </svg>
    <input id="searchInput" type="search" placeholder="도구 이름이나 설명으로 검색" autocomplete="off" aria-label="도구 검색">
  </div>
  <p id="resultCount" class="result-count" aria-live="polite"></p>
</header>

<main>
  <ul id="toolGrid" class="tool-grid"></ul>
  <p id="noResult" class="no-result" hidden>검색어에 맞는 도구가 없어요.</p>
</main>

<footer>
  <p id="maker" class="maker"></p>
  <p class="notice">입력한 내용은 이 브라우저 안에서만 처리되며 어디에도 저장·전송되지 않습니다.</p>
</footer>

<script>
/* =============================================================
   ★ 설정값: 여기만 고치면 됩니다
   ============================================================= */

// 만든 사람 이름과 맨 아래 문구
const AUTHOR_NAME = '○○○';
const FOOTER_SUFFIX = '2026 바이브 코딩 실습';

// 도구 목록
// - 새 도구를 만들면 아래에 한 줄만 추가하면 카드가 자동으로 생깁니다
// - ready: false 로 두면 "준비 중" 배지가 붙고 [열기] 버튼이 막힙니다
const TOOLS = [
  { emoji: '🍱', name: '점심 메뉴 룰렛',     desc: '오늘 점심을 대신 정해 드려요',             link: 'lunch.html',     ready: true  },
  { emoji: '📄', name: 'PDF 병합·분할기',    desc: '여러 PDF를 합치고 나눠요',                 link: 'pdf_tool.html',  ready: true  },
  { emoji: '📊', name: '자동 데이터 분석기', desc: '파일만 넣으면 분석하고 차트를 추천해요',   link: 'analyzer.html',  ready: true },
  { emoji: '⚡', name: '전력수요 대시보드',  desc: '공공데이터로 본 우리나라 전력 사용',       link: 'dashboard.html', ready: true },
];

/* =============================================================
   화면 요소 가져오기
   ============================================================= */
const toolGrid    = document.getElementById('toolGrid');
const searchInput = document.getElementById('searchInput');
const resultCount = document.getElementById('resultCount');
const noResult    = document.getElementById('noResult');
const maker       = document.getElementById('maker');

/* =============================================================
   카드 하나 만들기
   (글자는 textContent로 넣어 HTML이 실행되지 않게 함)
   ============================================================= */
function createCard(tool) {
  const li = document.createElement('li');
  li.className = 'tool-card' + (tool.ready ? '' : ' not-ready');

  // 준비 중 배지
  if (!tool.ready) {
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = '준비 중';
    li.appendChild(badge);
  }

  // 큰 이모지
  const emoji = document.createElement('div');
  emoji.className = 'emoji';
  emoji.setAttribute('aria-hidden', 'true');
  emoji.textContent = tool.emoji;

  // 도구 이름
  const title = document.createElement('h2');
  title.textContent = tool.name;

  // 한 줄 설명
  const desc = document.createElement('p');
  desc.className = 'desc';
  desc.textContent = tool.desc;

  // [열기] 버튼: 준비된 도구는 링크, 준비 중이면 누를 수 없는 표시
  let button;
  if (tool.ready) {
    button = document.createElement('a');
    button.className = 'btn-open';
    button.href = tool.link;
    button.textContent = '열기';
    button.setAttribute('aria-label', `${tool.name} 열기`);
  } else {
    button = document.createElement('span');
    button.className = 'btn-open disabled';
    button.textContent = '준비 중이에요';
    button.setAttribute('aria-disabled', 'true');
  }

  li.append(emoji, title, desc, button);
  return li;
}

/* =============================================================
   검색어에 맞는 카드만 그리기
   ============================================================= */
function render() {
  // 띄어쓰기와 대소문자를 무시하고 비교
  const normalize = (text) => text.toLowerCase().replace(/\s+/g, '');
  const keyword = normalize(searchInput.value);

  const filtered = TOOLS.filter(tool =>
    keyword === '' ||
    normalize(tool.name).includes(keyword) ||
    normalize(tool.desc).includes(keyword)
  );

  toolGrid.innerHTML = '';
  filtered.forEach(tool => toolGrid.appendChild(createCard(tool)));

  // 검색 결과 개수와 "결과 없음" 안내
  noResult.hidden = filtered.length > 0;
  resultCount.innerHTML = keyword === ''
    ? `도구 <b>${TOOLS.length}</b>개`
    : `검색 결과 <b>${filtered.length}</b>개`;
}

/* =============================================================
   이벤트 연결과 처음 시작
   ============================================================= */
searchInput.addEventListener('input', render);

// 맨 아래 만든 사람 문구
maker.textContent = `만든 사람: ${AUTHOR_NAME} · ${FOOTER_SUFFIX}`;

render();
</script>
</body>
</html>
