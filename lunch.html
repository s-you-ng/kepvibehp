<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 점심 룰렛</title>

<!-- 글꼴: Noto Sans KR (jsDelivr CDN의 Fontsource 패키지) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-kr@5/900.css">

<style>
  /* =========================================================
     기본 색상과 공통 값 (흰 배경 + 남색 포인트)
     ========================================================= */
  :root {
    --bg: #ffffff;            /* 전체 배경: 흰색 */
    --card: #ffffff;          /* 카드 배경 */
    --soft: #f4f7fc;          /* 옅은 남색 계열 배경 */
    --ink: #1c2433;           /* 기본 글자색 */
    --muted: #6b7486;         /* 흐린 글자색 */
    --accent: #1f3a6d;        /* 포인트 색: 남색 */
    --accent-dark: #162b52;   /* 버튼 눌림/hover용 진한 남색 */
    --accent-soft: #e8eef8;   /* 남색 아주 옅은 톤 */
    --line: #e3e8f1;          /* 테두리 */
    --warn: #d1393f;          /* 경고 문구 */
    --info: #1f3a6d;          /* 안내 문구 */
    --shadow: 0 6px 22px rgba(31, 58, 109, 0.08);
    --radius: 20px;
    --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }

  /* ---------- 맨 위 왼쪽: 업무 도구 모음으로 돌아가는 링크 ---------- */
  .topbar {
    max-width: 1120px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 16px 0;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    border-radius: 999px;
    color: var(--accent);
    background: var(--accent-soft);
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition: background .15s;
  }
  .back-link:hover { background: #dbe4f3; }
  .back-link:focus-visible { outline: 3px solid #9fb3d8; outline-offset: 2px; }

  /* ---------- 상단 제목 ---------- */
  header {
    text-align: center;
    padding: 18px 16px 4px;
  }
  header h1 {
    margin: 0;
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 900;
    letter-spacing: -1px;
    color: var(--ink);
  }
  header h1 .hl { color: var(--accent); }
  header p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 15px;
  }

  /* ---------- 전체 레이아웃: PC에서는 왼쪽 입력 / 오른쪽 룰렛 ---------- */
  .layout {
    flex: 1;
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
    align-items: start;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    min-width: 0;
  }
  .panel h2 {
    margin: 0 0 14px;
    font-size: 19px;
    font-weight: 700;
    color: var(--accent);
  }

  /* 최근 결과는 아래쪽에 가로로 길게 */
  .history-panel { grid-column: 1 / -1; }

  /* ---------- 버튼 공통 ---------- */
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    transition: transform .12s, background .12s, opacity .12s;
  }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid #9fb3d8; outline-offset: 2px; }

  /* ---------- 메뉴 입력 영역 ---------- */
  .add-row {
    display: flex;
    gap: 8px;
  }
  .add-row input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    outline: none;
    color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  .add-row input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(31, 58, 109, .12);
  }
  .add-row input:disabled { background: var(--soft); }

  .btn-add {
    padding: 0 18px;
    font-size: 16px;
    color: #fff;
    background: var(--accent);
  }
  .btn-add:hover:not(:disabled) { background: var(--accent-dark); }

  /* 안내 문구 */
  .msg {
    min-height: 1.5em;
    margin: 8px 2px 4px;
    font-size: 14px;
    font-weight: 700;
  }
  .msg.warn { color: var(--warn); }
  .msg.info { color: var(--info); }

  .count-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 6px 0 10px;
  }
  .count {
    font-weight: 700;
    color: var(--muted);
  }
  .count b { color: var(--accent); font-size: 18px; }
  .btn-clear {
    padding: 7px 12px;
    font-size: 13px;
    color: var(--warn);
    background: #fdeeee;
  }
  .btn-clear:hover:not(:disabled) { background: #fadede; }

  .menu-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .menu-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--soft);
    border: 1px solid var(--line);
    animation: popIn .25s ease;
  }
  .menu-list .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(31, 58, 109, .2);
  }
  .menu-list .name {
    flex: 1;
    font-weight: 700;
    word-break: break-all;
  }
  .btn-del {
    padding: 6px 10px;
    font-size: 13px;
    color: var(--muted);
    background: #ffffff;
    border: 1px solid var(--line);
  }
  .btn-del:hover:not(:disabled) { color: var(--warn); }
  .menu-list li.empty {
    justify-content: center;
    color: var(--muted);
    background: transparent;
    border-style: dashed;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ---------- 룰렛 영역 ---------- */
  .wheel-panel { text-align: center; }

  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }

  .wheel-wrap {
    position: relative;
    flex: 0 1 460px;
    width: 100%;
    max-width: 460px;
    padding-top: 22px;   /* 화살표가 들어갈 자리 */
  }
  #wheel {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    filter: drop-shadow(0 10px 18px rgba(31, 58, 109, .14));
  }
  /* 위쪽 가운데에 고정된 화살표 */
  .pointer {
    position: absolute;
    top: -2px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 44px;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 3px 0 #fff, 0 5px 10px rgba(0,0,0,.18);
    z-index: 2;
    pointer-events: none;
  }

  /* 카운트다운 */
  .countdown {
    flex: 0 0 130px;
    min-height: 150px;
    border-radius: 18px;
    background: var(--soft);
    border: 1.5px dashed #c5d2e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
  }
  .countdown .label {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }
  .countdown .num {
    font-size: 96px;
    font-weight: 900;
    line-height: 1.05;
    color: var(--accent);
  }
  .countdown .num.idle {
    font-size: 44px;
    line-height: 1.6;
  }
  .countdown .num.tick { animation: tick .45s ease; }
  @keyframes tick {
    0%   { transform: scale(1.6); opacity: .3; }
    100% { transform: scale(1);   opacity: 1; }
  }

  .btn-spin {
    margin-top: 18px;
    padding: 16px 44px;
    font-size: 21px;
    color: #fff;
    border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 8px 18px rgba(31, 58, 109, .25);
  }
  .btn-spin:hover:not(:disabled) { background: var(--accent-dark); }
  .wheel-panel .msg { text-align: center; }

  /* ---------- 최근 결과 ---------- */
  .history-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .history-list li {
    padding: 10px 16px;
    border-radius: 999px;
    background: var(--soft);
    border: 1px solid var(--line);
    font-weight: 700;
    animation: popIn .3s ease;
  }
  /* 가장 최근 결과는 남색으로 강조 */
  .history-list li:first-child {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .history-list li .time { color: var(--muted); margin-right: 4px; }
  .history-list li:first-child .time { color: #c3d0e8; }
  .history-list li.empty {
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--muted);
  }

  /* ---------- 결과 팝업 ---------- */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(22, 43, 82, .45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal[hidden] { display: none; }
  .modal-card {
    width: min(100%, 440px);
    background: #fff;
    border-radius: 24px;
    padding: 32px 24px 24px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.22);
    animation: modalIn .45s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes modalIn {
    from { transform: scale(.6); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }
  .modal-card .emoji { font-size: 54px; }
  .modal-card .result-text {
    margin: 10px 0 24px;
    font-size: clamp(24px, 6vw, 34px);
    font-weight: 900;
    line-height: 1.35;
    word-break: keep-all;
  }
  .modal-card .result-text strong {
    color: var(--accent);
    word-break: break-all;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .modal-actions button {
    flex: 1;
    padding: 14px 10px;
    font-size: 17px;
  }
  .btn-again {
    color: #fff;
    background: var(--accent);
  }
  .btn-again:hover { background: var(--accent-dark); }
  .btn-close {
    color: var(--accent);
    background: var(--accent-soft);
  }
  .btn-close:hover { background: #dbe4f3; }

  /* ---------- 맨 아래 안내 문구 ---------- */
  .site-footer {
    padding: 20px 16px 28px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    word-break: keep-all;
  }

  /* ---------- 꽃가루 캔버스: 화면 전체를 덮지만 클릭은 통과 ---------- */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 60;
  }

  /* =========================================================
     휴대폰 화면: 위아래로 배치
     ========================================================= */
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .panel { padding: 18px; }
    .stage {
      flex-direction: column;
      gap: 12px;
    }
    /* 카운트다운을 룰렛 위쪽에 가로로 길게 */
    .countdown {
      order: -1;
      flex: none;
      width: 100%;
      min-height: 0;
      flex-direction: row;
      gap: 12px;
      padding: 6px 12px;
    }
    .countdown .num { font-size: 56px; }
    .countdown .num.idle { font-size: 30px; line-height: 1.3; }
    .btn-spin { width: 100%; }
  }
</style>
</head>
<body>

<!-- 맨 위 왼쪽: 업무 도구 모음으로 이동 -->
<nav class="topbar" aria-label="상단 메뉴">
  <a class="back-link" href="index.html">← 업무 도구 모음</a>
</nav>

<header>
  <h1>🍚 오늘 <span class="hl">점심</span> 룰렛</h1>
  <p>고민은 그만! 룰렛이 대신 골라 드려요</p>
</header>

<main class="layout">
  <!-- ===================== 메뉴 입력 ===================== -->
  <section class="panel menu-panel" aria-labelledby="menuTitle">
    <h2 id="menuTitle">📝 메뉴 입력</h2>

    <div class="add-row">
      <input id="menuInput" type="text" maxlength="12"
             placeholder="메뉴 이름을 입력하세요" autocomplete="off" aria-label="메뉴 이름">
      <button id="addBtn" class="btn-add" type="button">추가</button>
    </div>
    <p id="menuMsg" class="msg" role="status" aria-live="polite"></p>

    <div class="count-row">
      <span id="countText" class="count"></span>
      <button id="clearBtn" class="btn-clear" type="button">전체 삭제</button>
    </div>

    <ul id="menuList" class="menu-list"></ul>
  </section>

  <!-- ===================== 룰렛 ===================== -->
  <section class="panel wheel-panel" aria-labelledby="wheelTitle">
    <h2 id="wheelTitle">🎯 룰렛</h2>

    <div class="stage">
      <div class="wheel-wrap">
        <div class="pointer" aria-hidden="true">▼</div>
        <canvas id="wheel" aria-label="점심 메뉴 룰렛"></canvas>
      </div>

      <div class="countdown" aria-live="polite">
        <span class="label">카운트다운</span>
        <span id="countdownNum" class="num idle">🍽️</span>
      </div>
    </div>

    <button id="spinBtn" class="btn-spin" type="button">룰렛 시작</button>
    <p id="spinMsg" class="msg" role="status" aria-live="polite"></p>
  </section>

  <!-- ===================== 최근 결과 ===================== -->
  <section class="panel history-panel" aria-labelledby="historyTitle">
    <h2 id="historyTitle">🕒 최근 결과</h2>
    <ul id="historyList" class="history-list"></ul>
  </section>
</main>

<!-- 맨 아래 안내 문구 -->
<footer class="site-footer">
  입력한 내용은 이 브라우저 안에서만 처리되며 어디에도 저장·전송되지 않습니다.
</footer>

<!-- ===================== 결과 팝업 ===================== -->
<div id="resultModal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="resultText">
    <div class="emoji">🎉</div>
    <p id="resultText" class="result-text">오늘 점심은 <strong id="resultName"></strong>!</p>
    <div class="modal-actions">
      <button id="againBtn" class="btn-again" type="button">다시 돌리기</button>
      <button id="closeBtn" class="btn-close" type="button">닫기</button>
    </div>
  </div>
</div>

<!-- 꽃가루 효과용 캔버스 -->
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
/* =============================================================
   설정값
   ============================================================= */
const MAX_MENUS = 10;          // 메뉴 최대 개수
const MIN_MENUS = 2;           // 룰렛을 돌리기 위한 최소 메뉴 개수
const SPIN_DURATION = 5000;    // 룰렛이 도는 시간(밀리초) = 정확히 5초
const EXTRA_SPINS = 8;         // 멈추기 전까지 추가로 도는 바퀴 수 (클수록 처음 속도가 빠름)
const HISTORY_LIMIT = 5;       // 최근 결과 기록 개수
const TAU = Math.PI * 2;       // 한 바퀴(360도)를 라디안으로

// 룰렛·캔버스에 쓰는 글꼴과 포인트 색
const FONT_FAMILY = '"Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
const NAVY = '#1f3a6d';

// 룰렛 칸 색상: 남색 포인트와 어울리는 밝은 톤 10가지
// (글자를 진한 색으로 쓰기 때문에 배경은 밝게, 이웃한 칸끼리는 색이 겹치지 않게 함)
const COLORS = [
  '#C9D8F2', '#F6DDB0', '#CDE9DD', '#E3D6F2', '#A9C1EA',
  '#F7CFC6', '#DCE8C6', '#BFE0EE', '#F2E3B8', '#D7DEEB'
];

// 안내 문구 모음
const MSG_MAX       = '메뉴는 최대 10개까지 입력할 수 있어요';
const MSG_DUPLICATE = '이미 있는 메뉴예요';
const MSG_MIN       = '메뉴를 2개 이상 입력해 주세요';

/* =============================================================
   상태 (브라우저 저장소는 쓰지 않고 변수에만 보관)
   ============================================================= */
let menus = ['김치찌개', '돈가스', '비빔밥', '짜장면', '냉면'];  // 처음 열었을 때 예시 메뉴
let history = [];          // 최근 결과 [{ time: '12:03', name: '김치찌개' }, ...]
let rotation = 0;          // 룰렛의 현재 회전 각도(라디안, 시계 방향)
let isSpinning = false;    // 룰렛이 도는 중인지 여부
let msgTimer = null;       // 메뉴 안내 문구를 지우는 타이머
let spinMsgTimer = null;   // 룰렛 안내 문구를 지우는 타이머

/* =============================================================
   화면 요소 가져오기
   ============================================================= */
const menuInput    = document.getElementById('menuInput');
const addBtn       = document.getElementById('addBtn');
const menuMsg      = document.getElementById('menuMsg');
const countText    = document.getElementById('countText');
const clearBtn     = document.getElementById('clearBtn');
const menuList     = document.getElementById('menuList');
const wheel        = document.getElementById('wheel');
const ctx          = wheel.getContext('2d');
const countdownNum = document.getElementById('countdownNum');
const spinBtn      = document.getElementById('spinBtn');
const spinMsg      = document.getElementById('spinMsg');
const historyList  = document.getElementById('historyList');
const resultModal  = document.getElementById('resultModal');
const resultName   = document.getElementById('resultName');
const againBtn     = document.getElementById('againBtn');
const closeBtn     = document.getElementById('closeBtn');
const confettiCanvas = document.getElementById('confetti');
const cctx         = confettiCanvas.getContext('2d');

/* =============================================================
   작은 도우미 함수들
   ============================================================= */

// 음수도 0 ~ m 사이로 바꿔 주는 나머지 연산 (각도 계산용)
function mod(a, m) {
  return ((a % m) + m) % m;
}

// 감속 easing 함수: 처음엔 빠르고 끝으로 갈수록 부드럽게 느려짐 (easeOutQuart)
// t는 0~1 사이 진행률, 반환값도 0~1
function easeOutQuart(t) {
  return 1 - Math.pow(1 - t, 4);
}

// 현재 시각을 "12:03" 형식으로 만들기
function formatTime(date) {
  const h = String(date.getHours()).padStart(2, '0');
  const m = String(date.getMinutes()).padStart(2, '0');
  return `${h}:${m}`;
}

// 메뉴 입력 영역 안내 문구 표시
// temporary가 true면 잠시 뒤 자동으로 사라짐
function showMenuMsg(text, type = 'warn', temporary = true) {
  clearTimeout(msgTimer);
  menuMsg.textContent = text;
  menuMsg.className = 'msg ' + type;
  if (temporary) {
    msgTimer = setTimeout(() => {
      menuMsg.textContent = '';
      // 사라질 때 메뉴가 10개라면 "최대 10개" 안내는 계속 보여 줌
      updateInputState();
    }, 2500);
  }
}

// 룰렛 영역 안내 문구 표시 (잠시 뒤 사라짐)
function showSpinMsg(text) {
  clearTimeout(spinMsgTimer);
  spinMsg.textContent = text;
  spinMsg.className = 'msg warn';
  spinMsgTimer = setTimeout(() => { spinMsg.textContent = ''; }, 2500);
}

/* =============================================================
   메뉴 추가 / 삭제
   ============================================================= */

// 메뉴 추가
function addMenu() {
  if (isSpinning) return;                       // 도는 중에는 추가 불가
  if (menus.length >= MAX_MENUS) {              // 10개가 넘으면 추가 불가
    showMenuMsg(MSG_MAX, 'info', false);
    return;
  }

  const name = menuInput.value.trim();          // 앞뒤 공백 제거
  if (name === '') {                            // 빈칸·공백만 있으면 무시
    menuInput.value = '';
    return;
  }

  // 같은 이름 검사 (영문 대소문자는 같은 것으로 취급)
  const exists = menus.some(m => m.toLowerCase() === name.toLowerCase());
  if (exists) {
    showMenuMsg(MSG_DUPLICATE, 'warn');
    menuInput.select();
    return;
  }

  menus.push(name);
  menuInput.value = '';
  menuMsg.textContent = '';
  spinMsg.textContent = '';
  updateAll();

  // 입력창이 아직 열려 있으면 계속 입력할 수 있게 포커스 유지
  if (!menuInput.disabled) menuInput.focus();
}

// 메뉴 하나 삭제
function deleteMenu(index) {
  if (isSpinning) return;
  menus.splice(index, 1);
  updateAll();
}

// 전체 삭제
function clearMenus() {
  if (isSpinning) return;
  menus = [];
  menuMsg.textContent = '';
  updateAll();
  menuInput.focus();
}

/* =============================================================
   화면 갱신
   ============================================================= */

// 메뉴가 바뀌었을 때 목록·개수·입력 상태·룰렛을 모두 다시 그림
function updateAll() {
  renderMenuList();
  countText.innerHTML = `현재 <b>${menus.length}</b> / ${MAX_MENUS}개`;
  updateInputState();
  drawWheel();
}

// 메뉴 목록 그리기
function renderMenuList() {
  menuList.innerHTML = '';

  if (menus.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '메뉴를 추가해 주세요';
    menuList.appendChild(li);
    return;
  }

  menus.forEach((name, i) => {
    const li = document.createElement('li');

    // 룰렛 칸과 같은 색 점
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = COLORS[i % COLORS.length];

    const label = document.createElement('span');
    label.className = 'name';
    label.textContent = name;           // textContent로 넣어 HTML이 실행되지 않게 함

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'btn-del';
    del.textContent = '삭제';
    del.disabled = isSpinning;
    del.setAttribute('aria-label', `${name} 삭제`);
    del.addEventListener('click', () => deleteMenu(i));

    li.append(dot, label, del);
    menuList.appendChild(li);
  });
}

// 입력창·버튼 사용 가능 여부 정리
function updateInputState() {
  const full = menus.length >= MAX_MENUS;

  // 10개가 됐거나 룰렛이 도는 중이면 입력창과 [추가] 버튼을 막음
  menuInput.disabled = full || isSpinning;
  addBtn.disabled = full || isSpinning;

  // 룰렛이 도는 동안 [전체 삭제], [룰렛 시작]도 막음
  clearBtn.disabled = isSpinning || menus.length === 0;
  spinBtn.disabled = isSpinning;

  // 10개일 때는 "최대 10개" 안내를 계속 보여 줌
  if (full) {
    clearTimeout(msgTimer);
    menuMsg.textContent = MSG_MAX;
    menuMsg.className = 'msg info';
  } else if (menuMsg.textContent === MSG_MAX) {
    menuMsg.textContent = '';
  }
}

// 최근 결과 그리기
function renderHistory() {
  historyList.innerHTML = '';

  if (history.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '아직 기록이 없어요. 룰렛을 돌려 보세요!';
    historyList.appendChild(li);
    return;
  }

  history.forEach(item => {
    const li = document.createElement('li');
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = item.time;
    li.append(time, document.createTextNode(`- ${item.name}`));
    historyList.appendChild(li);
  });
}

/* =============================================================
   룰렛 그리기 (canvas)
   -------------------------------------------------------------
   각도 기준:
   - 룰렛 "자체" 좌표에서 i번째 칸은 맨 위(12시)에서 시계 방향으로
     [i × 칸각도, (i+1) × 칸각도] 범위를 차지함
   - rotation만큼 시계 방향으로 돌린 뒤 그림
   - canvas에서 12시 방향은 -π/2 이므로, 실제로 그리는 시작 각도는
     -π/2 + rotation + i × 칸각도
   ============================================================= */

// 화면 크기에 맞춰 캔버스 해상도 조정 (레티나 화면에서도 선명하게)
function resizeWheel() {
  const size = wheel.clientWidth;
  if (size === 0) return;
  const dpr = window.devicePixelRatio || 1;
  wheel.width = Math.round(size * dpr);
  wheel.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // 이후에는 CSS 픽셀 단위로 그리기
  drawWheel();
}

function drawWheel() {
  const size = wheel.clientWidth;
  if (size === 0) return;
  const c = size / 2;          // 중심 좌표
  const r = c - 12;            // 칸이 그려지는 반지름 (테두리 두께만큼 안쪽)
  const n = menus.length;

  ctx.clearRect(0, 0, size, size);

  // ---- 바깥 테두리 (흰색 + 남색 링) ----
  ctx.beginPath();
  ctx.arc(c, c, c - 2, 0, TAU);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = NAVY;
  ctx.stroke();

  // ---- 메뉴가 없을 때: 회색 원과 안내 문구 ----
  if (n === 0) {
    ctx.beginPath();
    ctx.arc(c, c, r, 0, TAU);
    ctx.fillStyle = '#f4f7fc';
    ctx.fill();
    ctx.fillStyle = '#6b7486';
    ctx.font = `700 ${Math.max(14, size * 0.045)}px ${FONT_FAMILY}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('메뉴를 추가해 주세요', c, c);
    return;
  }

  const seg = TAU / n;         // 한 칸의 각도

  // ---- 칸 그리기 ----
  for (let i = 0; i < n; i++) {
    const start = -Math.PI / 2 + rotation + i * seg;
    const end = start + seg;

    // 부채꼴 모양 칸
    ctx.beginPath();
    ctx.moveTo(c, c);
    ctx.arc(c, c, r, start, end);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();

    // 칸 사이 흰색 구분선
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    // ---- 메뉴 이름: 칸 가운데 방향으로 회전해서 바깥쪽에 씀 ----
    const mid = start + seg / 2;
    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(mid);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';

    // 글자 크기: 룰렛 크기에 비례하되, 칸 안에 들어가도록 줄임
    const maxWidth = r * 0.6;
    let fontSize = Math.min(24, Math.max(13, r * 0.11));
    let label = menus[i];
    ctx.font = `700 ${fontSize}px ${FONT_FAMILY}`;
    while (ctx.measureText(label).width > maxWidth && fontSize > 11) {
      fontSize -= 1;
      ctx.font = `700 ${fontSize}px ${FONT_FAMILY}`;
    }
    // 그래도 길면 뒤를 "…"로 줄임
    while (ctx.measureText(label).width > maxWidth && label.length > 1) {
      label = label.slice(0, -2) + '…';
    }

    // 흰 테두리를 먼저 그리고 글자를 그려 어떤 배경색에서도 잘 보이게 함
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineJoin = 'round';
    ctx.strokeText(label, r - 16, 0);
    ctx.fillStyle = '#1c2433';
    ctx.fillText(label, r - 16, 0);
    ctx.restore();
  }

  // ---- 가운데 동그란 버튼 모양 장식 ----
  const hub = r * 0.16;
  ctx.beginPath();
  ctx.arc(c, c, hub, 0, TAU);
  ctx.fillStyle = NAVY;
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = `900 ${Math.max(12, hub * 0.55)}px ${FONT_FAMILY}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('점심', c, c + 1);
}

/* =============================================================
   룰렛 돌리기
   ============================================================= */

// 도는 중 여부를 바꾸고 버튼들을 막거나 풀어 줌
function setSpinning(on) {
  isSpinning = on;
  updateInputState();
  // 목록의 [삭제] 버튼들
  menuList.querySelectorAll('.btn-del').forEach(btn => { btn.disabled = on; });
}

// 카운트다운 숫자 표시 (숫자가 바뀔 때마다 톡 튀는 효과)
function showCountdown(value, idle = false) {
  countdownNum.textContent = value;
  countdownNum.classList.toggle('idle', idle);
  countdownNum.classList.remove('tick');
  void countdownNum.offsetWidth;          // 애니메이션을 다시 시작시키기 위한 트릭
  if (!idle) countdownNum.classList.add('tick');
}

function startSpin() {
  if (isSpinning) return;

  // 메뉴가 2개 미만이면 시작하지 않음
  if (menus.length < MIN_MENUS) {
    showSpinMsg(MSG_MIN);
    return;
  }
  spinMsg.textContent = '';

  const startTime = performance.now();    // 버튼을 누른 순간을 기준으로 5초를 잼
  const n = menus.length;
  const seg = TAU / n;

  // ① 버튼을 누르는 순간 당첨 메뉴를 무작위로 먼저 정함
  const winnerIndex = Math.floor(Math.random() * n);
  const winnerName = menus[winnerIndex];

  // ② 화살표가 가리킬 "룰렛 자체 좌표"의 각도
  //    칸의 경계선에 걸리지 않도록 칸 폭의 15% ~ 85% 사이 안쪽 지점을 무작위로 고름
  const offsetInSeg = seg * (0.15 + Math.random() * 0.7);
  const targetLocal = winnerIndex * seg + offsetInSeg;

  // ③ 회전 각도 계산
  //    화살표는 12시에 고정되어 있으므로, 룰렛을 R만큼 돌렸을 때
  //    화살표가 가리키는 룰렛 자체 각도는 (-R)이 됨.
  //    따라서 최종 회전 각도 R이 (-targetLocal)과 같은 방향이 되면 당첨 칸을 가리킴.
  const startRotation = mod(rotation, TAU);        // 현재 각도를 0~2π로 정리
  const finalAngle = mod(-targetLocal, TAU);       // 멈춰야 할 각도(0~2π)
  const delta = mod(finalAngle - startRotation, TAU); // 지금 각도에서 더 돌아야 할 양
  const totalRotation = EXTRA_SPINS * TAU + delta; // 여러 바퀴 + 나머지
  rotation = startRotation;

  setSpinning(true);
  let lastShown = null;

  // ④ 매 프레임마다 진행률에 easing을 적용해 각도를 정함
  function frame(now) {
    const elapsed = Math.min(Math.max(now - startTime, 0), SPIN_DURATION);
    const t = elapsed / SPIN_DURATION;                 // 0 → 1
    rotation = startRotation + totalRotation * easeOutQuart(t);
    drawWheel();

    // 남은 시간으로 카운트다운 숫자 계산 (5, 4, 3, 2, 1)
    const remain = Math.ceil((SPIN_DURATION - elapsed) / 1000);
    if (remain > 0 && remain !== lastShown) {
      showCountdown(remain);
      lastShown = remain;
    }

    if (elapsed < SPIN_DURATION) {
      requestAnimationFrame(frame);
    } else {
      // 정확히 목표 각도에서 멈추도록 마지막 값을 고정
      rotation = startRotation + totalRotation;
      drawWheel();
      finishSpin(winnerName);
    }
  }
  requestAnimationFrame(frame);
}

// 룰렛이 멈췄을 때
function finishSpin(winnerName) {
  setSpinning(false);
  showCountdown('🎉', true);

  // 최근 결과 맨 앞에 추가하고 5개까지만 남김
  history.unshift({ time: formatTime(new Date()), name: winnerName });
  history = history.slice(0, HISTORY_LIMIT);
  renderHistory();

  openModal(winnerName);
  launchConfetti();
}

/* =============================================================
   결과 팝업
   ============================================================= */
function openModal(name) {
  resultName.textContent = name;
  resultModal.hidden = false;
  againBtn.focus();
}

function closeModal() {
  resultModal.hidden = true;
  showCountdown('🍽️', true);
}

/* =============================================================
   꽃가루 효과 (외부 라이브러리 없이 직접 구현)
   -------------------------------------------------------------
   - 종이 조각(사각형/동그라미)마다 위치, 속도, 회전, 색을 가짐
   - 매 프레임 중력을 더하고 공기 저항으로 옆 속도를 줄여 자연스럽게 떨어짐
   - 세로로 납작해졌다 펴지는(cos) 효과로 팔랑거리는 느낌을 냄
   ============================================================= */
let particles = [];
let confettiRunning = false;
let confettiLast = 0;
// 남색을 중심으로 한 꽃가루 색
const CONFETTI_COLORS = ['#1F3A6D', '#3B5F9E', '#7FA2DB', '#C9D8F2', '#F2B84B', '#F28C6B', '#5BB89A', '#FFFFFF'];

function resizeConfetti() {
  const dpr = window.devicePixelRatio || 1;
  confettiCanvas.width = Math.round(window.innerWidth * dpr);
  confettiCanvas.height = Math.round(window.innerHeight * dpr);
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// 꽃가루 조각 하나 만들기
function makeParticle(x, y, vx, vy) {
  return {
    x, y, vx, vy,
    size: 6 + Math.random() * 8,
    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
    rot: Math.random() * TAU,                 // 현재 회전 각도
    vr: (Math.random() - 0.5) * 0.3,          // 회전 속도
    flip: Math.random() * TAU,                // 팔랑거림 위상
    vflip: 0.08 + Math.random() * 0.12,       // 팔랑거림 속도
    circle: Math.random() < 0.3               // 30%는 동그라미, 나머지는 사각형
  };
}

function launchConfetti() {
  const w = window.innerWidth;
  const h = window.innerHeight;

  // 화면 가운데 아래쪽에서 위로 "펑" 터지는 조각들
  for (let i = 0; i < 160; i++) {
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.4;  // 위쪽으로 부채꼴
    const speed = 10 + Math.random() * 12;
    particles.push(makeParticle(
      w / 2 + (Math.random() - 0.5) * 80,
      h * 0.6,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed
    ));
  }
  // 화면 위에서 비처럼 내려오는 조각들
  for (let i = 0; i < 120; i++) {
    particles.push(makeParticle(
      Math.random() * w,
      -20 - Math.random() * h * 0.6,
      (Math.random() - 0.5) * 3,
      2 + Math.random() * 3
    ));
  }

  if (!confettiRunning) {
    confettiRunning = true;
    confettiLast = performance.now();
    requestAnimationFrame(confettiLoop);
  }
}

function confettiLoop(now) {
  // dt: 60fps 기준 1프레임을 1로 보고, 화면 주사율이 달라도 같은 속도로 움직이게 함
  const dt = Math.min((now - confettiLast) / 16.67, 3);
  confettiLast = now;

  const w = window.innerWidth;
  const h = window.innerHeight;
  cctx.clearRect(0, 0, w, h);

  for (const p of particles) {
    p.vy += 0.3 * dt;                          // 중력
    p.vx *= Math.pow(0.985, dt);               // 공기 저항
    if (p.vy > 6) p.vy = 6;                    // 너무 빨리 떨어지지 않게 (종이처럼)
    p.x += p.vx * dt + Math.sin(p.flip) * 0.6; // 살랑살랑 좌우로 흔들림
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    p.flip += p.vflip * dt;

    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.scale(1, Math.cos(p.flip));           // 팔랑거리는 효과
    cctx.fillStyle = p.color;
    // 흰 조각도 흰 배경에서 보이도록 옅은 테두리
    if (p.color === '#FFFFFF') {
      cctx.strokeStyle = 'rgba(31,58,109,0.25)';
      cctx.lineWidth = 1;
    }
    if (p.circle) {
      cctx.beginPath();
      cctx.arc(0, 0, p.size / 2, 0, TAU);
      cctx.fill();
      if (p.color === '#FFFFFF') cctx.stroke();
    } else {
      cctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      if (p.color === '#FFFFFF') cctx.strokeRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    }
    cctx.restore();
  }

  // 화면 아래로 사라진 조각은 지움
  particles = particles.filter(p => p.y < h + 40);

  if (particles.length > 0) {
    requestAnimationFrame(confettiLoop);
  } else {
    confettiRunning = false;
    cctx.clearRect(0, 0, w, h);
  }
}

/* =============================================================
   이벤트 연결
   ============================================================= */

// [추가] 버튼
addBtn.addEventListener('click', addMenu);

// Enter 키로 추가
// 한글 입력은 글자를 조합하는 중(isComposing)에 Enter가 눌리면
// 마지막 글자가 입력창에 남거나 두 번 추가되는 문제가 있어서,
// 조합 중이면 조합이 끝난 뒤(compositionend)에 추가하도록 처리함
let pendingEnter = false;
menuInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (e.isComposing || e.keyCode === 229) {
    pendingEnter = true;
    return;
  }
  addMenu();
});
menuInput.addEventListener('compositionend', () => {
  if (!pendingEnter) return;
  pendingEnter = false;
  setTimeout(addMenu, 0);   // 조합된 글자가 입력창에 확정된 뒤 추가
});

// [전체 삭제]
clearBtn.addEventListener('click', clearMenus);

// [룰렛 시작]
spinBtn.addEventListener('click', startSpin);

// 팝업 버튼들
againBtn.addEventListener('click', () => {
  closeModal();
  startSpin();
});
closeBtn.addEventListener('click', closeModal);

// 팝업 바깥 어두운 부분을 누르거나 Esc를 누르면 닫기
resultModal.addEventListener('click', (e) => {
  if (e.target === resultModal) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !resultModal.hidden) closeModal();
});

// 화면 크기가 바뀌면 룰렛과 꽃가루 캔버스 크기를 다시 맞춤
if ('ResizeObserver' in window) {
  new ResizeObserver(resizeWheel).observe(wheel);
}
window.addEventListener('resize', () => {
  resizeWheel();
  resizeConfetti();
});

/* =============================================================
   처음 시작
   ============================================================= */
resizeConfetti();
resizeWheel();
updateAll();
renderHistory();

// 웹 글꼴(Noto Sans KR)이 늦게 내려받아지면 룰렛 글자를 한 번 더 그려 글꼴을 맞춤
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(drawWheel);
}
